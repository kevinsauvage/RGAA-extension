name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:coverage

      - name: Regenerate docs and check for drift
        run: |
          npm run docs
          git diff --exit-code docs/ src/lib/rgaa/referential.json

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - run: xvfb-run -a npm run test:e2e

      - name: Content script bundle size budget (gzip)
        run: |
          FILE=$(find dist/assets -name '*content-script*.js' ! -name '*loader*' | head -1)
          if [ -z "$FILE" ]; then
            echo "Content script bundle not found"
            exit 1
          fi
          BYTES=$(gzip -c "$FILE" | wc -c | tr -d ' ')
          echo "Content script gzipped: ${BYTES} bytes ($FILE)"
          if [ "$BYTES" -gt 400000 ]; then
            echo "Content script exceeds 400 KB gzip budget"
            exit 1
          fi
