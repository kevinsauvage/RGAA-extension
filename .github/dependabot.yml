version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Tailwind 4 is a migration (CSS-first config, new PostCSS plugin), not a bump; the extension is paused.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
    groups:
      vite-ecosystem:
        patterns:
          - vite
          - '@vitejs/*'
          - '@crxjs/*'
          - vitest
          - '@vitest/*'
      react-ecosystem:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      axe-core:
        patterns:
          - axe-core
      openai-related:
        patterns:
          - jspdf
